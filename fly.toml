# Fly.io deployment (https://shelfie-ravikiran.fly.dev). To run your own copy, change `app` and
# `primary_region` (fly platform regions). SQLite lives on one volume, so keep exactly one machine:
# deploy with `fly deploy --ha=false`.
app = "shelfie-ravikiran"
primary_region = "ord"

[build]

[env]
  SHELFIE_DATA = "/data"

[[mounts]]
  source = "shelfie_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # restart the machine if Shelfie stops answering
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/site"
    timeout = "5s"

[[vm]]
  memory = "512mb"
