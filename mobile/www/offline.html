<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelfie</title>
<script src="config.js"></script>
<style>
  :root{--bg:#f6f1e7;--ink:#2b2118;--muted:#7a6c5d;--accent:#b4532a;--card:#fffdf8;--line:#e4dccb}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1814;--ink:#f1e9dc;--muted:#a69a8a;--accent:#e07a4a;--card:#262019;--line:#3a3128}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:340px}
  h1{font:700 40px/1 Georgia,serif;margin:0 0 6px}
  h1 span{color:var(--accent)}
  h2{font:600 20px/1.3 Georgia,serif;margin:28px 0 8px}
  p{color:var(--muted);margin:0 0 6px}
  code{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  button{margin-top:22px;font:600 16px system-ui,sans-serif;border:none;border-radius:14px;padding:14px 28px;background:var(--accent);color:#fff;width:100%}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="box">
  <h1>Shelf<span>ie</span></h1>
  <h2>Can't reach Shelfie right now</h2>
  <p id="why">Check that you're connected to the internet.</p>
  <button id="retry">Try again</button>
</div>
<script>
  const url = window.SHELFIE_URL;
  // a server on the home network (an IP address over plain http) needs the same Wi-Fi
  if (/^http:\/\/(\d+\.){3}\d+/.test(url)) {
    document.getElementById("why").innerHTML =
      "This test version talks to Shelfie on a computer at home (<code>" + url.replace("http://", "") +
      "</code>). Connect to the same Wi-Fi and make sure the server is running.";
  }
  document.getElementById("retry").onclick = () => location.replace(url);
  // come back by itself as soon as the network does
  addEventListener("online", () => location.replace(url));
</script>
</body>
</html>
